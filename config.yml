# This is an example site configuration setup file.
# (It's YAML and this is a comment.)
title: Blogtini
user: traceypooh
repo: blogtini
git_provider: github # github or gitlab
# deployed live site (required).  end with /
site_url: https://blogtini.com/

img_site: img/profile.jpg
posts_per_page: 10
remove_blur: true

# Your site's theme.  Either:
#   - the name of a theme that comes with blogtini (same version as your blogtini `index.js`), eg: editorial
#     The themes: https://github.com/traceypooh/blogtini/blob/main/THEMES.md
#     Try them live: https://blogtini.com -- its theme picker (your picks there last 24 hours, just for you)
#   - or an absolute url, or relative url (subdir) from your site's top page directory, to a theme's `index.js`
# Default theme home: https://blogtini.com/theme/future-imperfect/index.js
# Default: future-imperfect theme alongside your blogtini `index.js`.
# theme: editorial
theme: future-imperfect

intro:
  rss: true
  social: true
  paragraph: "Technophile · Optimist · <a href=/biking>Cyclist</a> <i class='fa fa-bicycle'></i> · <a href=https://archive.org/about/bios.php>Archivist <i class='fa fa-landmark'></i></a> · Design · <a href=/video>Video</a> · TV · Containers <i class='fab fa-docker'></i>"

menu:
  # Sets the menu items in the navigation bar
  # Identifier prepends a Font Awesome icon to the menu item
  main:
    - name:              Home
      identifier:        home
      url:               /
      pre:               <i class='fa fa-home'></i>
      weight:            1

    - name:              About
      identifier:        about
      url:               /about/
      pre:               <i class='far fa-id-card'></i>
      weight:            2

    - name:              Categories
      identifier:        categories
      url:               /?categories
      pre:               <i class='fas fa-sitemap'></i>
      weight:            3

    - name:              Contact
      identifier:        contact
      url:               /?contact
      pre:               <i class='far fa-envelope'></i>
      weight:            6


# Sidebar "See More" button link.  Default: homepage, scrolled to the post after the sidebar's recent posts
# view_more_posts_link: /?page/2

sidebar:
  about: blogtini is a nonstop dance party.  so you dont have to.  thanks for dropping by today.  you look nice.
  post_amount: 5
  # set to show or to hide categories in the sidebar
  categories: true
  # Sets Categories to sort by number of posts instead of alphabetical
  categories_by_count: true
  # Which side of posts the sidebar goes: left, right, or none.  Default: each theme's own layout
  # (eg: future-imperfect, editorial, striped: left; strongly-typed, helios: right).
  # Set it to pin it, for themes that can move it (so far: helios, strongly-typed)
  # position: left

footer:
  rss: true
  social: true

social:
  rss: index.xml
  twitter: tracey_pooh
  youtube: '@traceypooh'
  linkedin: traceypooh
  pinterest: poohbot
  github: traceypooh
  gitlab: traceypooh
  codepen: traceypooh
  stackoverflow: 11941875 # User Number
  flickr: 46222920@N05
  tumblr: traceypooh
  strava: traceypooh
  mastodon: 'mastodon.social/@traceypooh'

# share opts: ['twitter', 'facebook', 'pinterest', 'email', 'linkedin', 'reddit']
social_share: ['twitter', 'facebook', 'pinterest']

staticman:
  # https://staticman.net/docs/getting-started (self-hosted, gitlab, other)
  # https://github.com/traceypooh/staticmin (github with netlify)
  # If using GitHub, setup GitHub App by going to https://github.com/apps/staticman-net
  enabled:  true
  api:      blogtini.netlify.app
  branch:   main

contact:
  # You can sign up for your own free email relay for your 'contact me' page: https://formspree.io/
  email_service: https://formspree.io/f/mgedbred
  answer_time: 24
