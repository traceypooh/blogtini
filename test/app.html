<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code App probe</title>
<style>
  body { font: 15px/1.4 -apple-system, system-ui, sans-serif; margin: 16px; }
  pre { white-space: pre-wrap; word-break: break-all; background: #8882; padding: 8px; font-size: 12px; }
</style>
</head>
<body>
<h3>Code App preview probe</h3>
<p>Open this file in Code App's editor, tap preview.  Reload it a couple times (and again after quitting the app) for the localStorage check.</p>
<div id="out"></div>

<script type="module">
/*
  Answers, for a dev-mode preview (eg: iOS Code App's localhost server):
    1. does the server give directory listings?  (so JS could find posts w/ no index file at all)
    2. does localStorage persist across reloads / app restarts?
    3. can we fetch the live site's index.xml cross-origin?  (GitHub Pages CORS)
*/
const out = document.getElementById('out')

function show(title, text) {
  out.insertAdjacentHTML('beforeend', `<h4>${title}</h4><pre></pre>`)
  out.lastElementChild.textContent = text
}

show('location', location.href)

for (const dir of ['../img/', '../comments/', '../']) {
  try {
    const res = await fetch(dir)
    const text = await res.text()
    show(`1. fetch ${dir}`, `HTTP ${res.status}  ${res.headers.get('content-type')}\n\n${text.slice(0, 600)}`)
  } catch (err) {
    show(`1. fetch ${dir}`, `FAILED: ${err}`)
  }
}

try {
  const n = Number(localStorage.getItem('code-app-probe') ?? 0) + 1
  localStorage.setItem('code-app-probe', n)
  show('2. localStorage', `this is load #${n} (should go up each reload, and survive an app restart)`)
} catch (err) {
  show('2. localStorage', `FAILED: ${err}`)
}

try {
  const res = await fetch('https://blogtini.com/index.xml')
  const text = await res.text()
  show('3. cross-origin index.xml', `HTTP ${res.status}  ${text.length} chars\n\n${text.slice(0, 300)}`)
} catch (err) {
  show('3. cross-origin index.xml', `FAILED (likely CORS): ${err}`)
}
</script>
</body>
</html>
