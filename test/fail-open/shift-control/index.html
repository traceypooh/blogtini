<!DOCTYPE html><title>Shift control</title>
<p>Control for cls.js: this text is visible right away, then JS pushes it down 300px at 1s.
Must report CLS &gt; 0 with JS on, or the measuring is broken.</p>
<script type="module">
setTimeout(() => document.body.insertAdjacentHTML('afterbegin', '<div style="height:300px">inserted</div>'), 1000)
</script>
